<!DOCTYPE html>
<!-- GameSpy Revival invite page. Put this on GitHub Pages (free) as join.html; invites then look like
     https://YOURNAME.github.io/gamespy-revival/join.html#6RTH-6RTV-7X  and are clickable in Discord,
     texts and email. The code after # never leaves the friend's browser. GPL-3.0. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join a GameSpy Revival group</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #05090f; color: #e8eef6;
         font: 16px/1.5 "Segoe UI", system-ui, sans-serif; }
  .card { width: min(440px, 92vw); background: #151d29; border: 1px solid #263244; border-radius: 12px; padding: 32px; text-align: center; }
  .logo { width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 50%; border: 3px solid #74c8ff; display: grid; place-items: center;
          font-weight: 700; font-size: 22px; color: #74c8ff; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { color: #b9c4d3; margin: 0 0 18px; }
  .code { font: 600 20px Consolas, monospace; background: #05090f; border-radius: 8px; padding: 10px; margin-bottom: 18px; letter-spacing: 1px; }
  a.btn, button { display: block; width: 100%; box-sizing: border-box; padding: 12px; border-radius: 8px; border: 0; margin-top: 10px;
                  font: 600 15px "Segoe UI", system-ui, sans-serif; cursor: pointer; text-decoration: none; }
  .primary { background: #1d7f50; color: #fff; }
  .plain { background: #263244; color: #e8eef6; }
  small { display: block; color: #8b98aa; margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">GS</div>
  <h1>You're invited to a group</h1>
  <p>Open it in GameSpy Revival: free, open-source chat, voice and server browsing for classic multiplayer games.</p>
  <div class="code" id="code">no invite code</div>
  <a class="btn primary" id="open" href="#">Open in GameSpy Revival</a>
  <button class="plain" id="copy" type="button">Copy invite code</button>
  <a class="btn plain" id="get" href="https://github.com/Wulfshark/gamespy-revival/releases">Don't have it? Download GameSpy Revival</a>
  <small>After installing, press + &gt; Join a Group and paste the code.</small>
</div>
<script>
  var code = decodeURIComponent((location.hash || "").replace(/^#/, "")).trim();
  if (!/^[A-Za-z0-9.:\-]{4,80}$/.test(code)) code = "";
  var link = code ? "gamespy://join/" + code : "";
  document.getElementById("code").textContent = code || "no invite code";
  var open = document.getElementById("open");
  if (link) { open.href = link; setTimeout(function () { location.href = link; }, 400); }
  document.getElementById("copy").onclick = function () {
    if (!code) return;
    var b = this;
    function done() { b.textContent = "Copied"; }
    if (navigator.clipboard) navigator.clipboard.writeText(link).then(done, done); else done();
  };
</script>
</body>
</html>
